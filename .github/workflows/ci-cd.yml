name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q summarize_docx.py

      - name: Smoke-test DOCX generation
        run: |
          python summarize_docx.py \
            --input sample-files.com-image-document.docx \
            --output "$RUNNER_TEMP/summary.docx"
          test -s "$RUNNER_TEMP/summary.docx"

  package:
    name: Package application
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create package
        env:
          PACKAGE_NAME: automation-pipeline-${{ github.ref_name }}.zip
        run: |
          mkdir -p dist
          zip -j "dist/$PACKAGE_NAME" \
            summarize_docx.py \
            requirements.txt \
            README.md

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: automation-pipeline-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: automation-pipeline-${{ github.ref_name }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
